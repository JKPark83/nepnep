name: NepNepSpike
options:
  bundleIdPrefix: com.nepnep
  deploymentTarget:
    iOS: "26.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.12.4
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.9.0
targets:
  NepNepSpike:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: FluidAudio
      - package: WhisperKit
        product: WhisperKit
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSpeechRecognitionUsageDescription: 전사 성능 검증을 위해 음성 인식을 사용합니다.
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
