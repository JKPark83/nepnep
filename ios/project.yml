name: NepNep
options:
  bundleIdPrefix: com.nepnep
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.12.4
  # 전사 엔진 목록(engines.yml)을 읽는 용도. 손으로 파싱하려다 인용부호·중첩에서
  # 틀리느니 쓰던 것을 쓴다.
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 5.1.0
settings:
  base:
    # 둘 다 로컬 빌드용 기본값이다 — TestFlight 업로드 때는 CI가 값을 정해 주입한다.
    # (.github/workflows/testflight.yml: 빌드 번호는 ASC 최신 +1, 마케팅 버전은 승인된 트레인 회피)
    # MARKETING_VERSION은 "최소 희망 버전"이라 1.0 → 1.1 같은 의미 있는 인상만 손으로 올린다.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: WDNVP9B8A9
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  NepNep:
    type: application
    platform: iOS
    sources:
      - NepNep
      - Shared
      - SharedWatch
    dependencies:
      - target: NepNepWidgets
      # 워치 앱은 본체 번들의 Watch/ 안으로 임베드된다 — 이게 "앱을 설치하면
      # 워치 앱도 설치할 수 있다"를 만족시키는 지점이다. 별도 App Store 등재가 아니다.
      - target: NepNepWatch
      - package: FluidAudio
      - package: Yams
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # xcodegen의 iOS 프리셋이 타깃 레벨 값으로 settings.base를 덮어쓴다 —
        # 두 곳을 같이 두지 않으면 어느 쪽이 이겼는지 알기 어려워진다.
        # 아이패드가 포함되면 altool이 멀티태스킹용 4방향(upside-down 포함)을
        # 요구하므로 아래 UISupportedInterfaceOrientations~ipad가 반드시 함께 있어야 한다.
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: NepNep/Info.plist
      properties:
        CFBundleDisplayName: 넵넵
        UILaunchStoryboardName: LaunchScreen
        # $(...) 참조로 둬야 CI가 xcodebuild 인자로 주입한 값이 번들에 반영된다.
        # 명시하지 않으면 xcodegen이 settings의 값을 리터럴로 박아 넣어
        # 매 빌드가 같은 번호로 올라가고 두 번째 업로드부터 거부된다.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # GENERATE_INFOPLIST_FILE: NO라 Xcode가 기본값을 채워주지 않는다 — 없으면
        # altool이 업로드를 거부한다(90474). 값은 키가 없을 때 iOS가 적용하던
        # 기본 동작(iPhone은 upside-down 제외) 그대로다.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 아이패드는 멀티태스킹 때문에 4방향을 모두 지원해야 한다 — 하나라도 빠지면
        # 90474로 거부된다. ~ipad 접미사로 갈라 둬야 위의 아이폰 3방향이 유지된다.
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # HTTPS 외에 자체 암호화를 쓰지 않는다 — 업로드마다 ASC에서 수출 규정을
        # 손으로 답하지 않도록 미리 박아 둔다.
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 회의 음성을 녹음해 기기 안에서 회의록으로 정리합니다.
        NSSpeechRecognitionUsageDescription: 녹음한 회의 음성을 기기 안에서 글로 옮겨 회의록을 만듭니다.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        BGTaskSchedulerPermittedIdentifiers:
          - com.nepnep.processing
          - com.nepnep.processing.continued
        CFBundleURLTypes:
          - CFBundleURLName: com.nepnep.NepNep.oauth
            CFBundleURLSchemes: [nepnep]
        # engines.yml을 파일 앱에서 직접 고칠 수 있게 문서 폴더를 연다 (#21 후속)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 테일스케일 tailnet에는 HTTPS 인증서가 없다 — 집 맥에 붙는 경로만 평문
        # HTTP를 허용한다. 이 트래픽은 이미 WireGuard로 암호화돼 나간다.
        NSAppTransportSecurity:
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
  NepNepWidgets:
    type: app-extension
    platform: iOS
    sources:
      - NepNepWidgets
      - Shared
    info:
      path: NepNepWidgets/Info.plist
      properties:
        CFBundleDisplayName: NepNepWidgets
        # 확장의 버전은 본체 앱과 정확히 같아야 업로드가 통과한다 — 리터럴로 두면
        # 본체만 CI 주입값으로 올라가 불일치로 거부된다.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        PRODUCT_BUNDLE_IDENTIFIER: com.nepnep.NepNep.widgets
        # 확장의 기기 패밀리가 본체와 다르면 번들 검증에서 걸린다.
        TARGETED_DEVICE_FAMILY: "1,2"
  NepNepWatch:
    type: application
    platform: watchOS
    sources:
      - NepNepWatch
      - SharedWatch
    info:
      path: NepNepWatch/Info.plist
      properties:
        CFBundleDisplayName: 넵넵
        # 본체·위젯과 정확히 같은 값이어야 업로드가 통과한다 — 리터럴로 두면
        # 본체만 CI 주입값으로 올라가 번들 불일치로 거부된다(위젯과 같은 함정).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # watchOS 7+ 단일 타깃 워치 앱 — 짝이 되는 아이폰 앱을 여기서 가리킨다.
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.nepnep.NepNep
        # 권한 프롬프트는 워치에서 뜬다 — 아이폰 쪽 문구와 별개로 필요하다.
        NSMicrophoneUsageDescription: 회의 음성을 녹음해 아이폰으로 보내 회의록으로 정리합니다.
        # 손목을 내려 화면이 꺼져도 녹음이 이어지게 한다.
        # WKBackgroundModes는 workout-processing 계열만 받아 audio를 넣으면 업로드가
        # 거부된다(altool 90362) — watchOS에서 백그라운드 오디오는 이 키를 쓴다.
        # 다만 문서상 재생·햅틱용이라 녹음 유지까지 보장하지는 않는다. 손목을 내려도
        # 녹음이 이어지는지는 실기기 검증이 필요하고, 안 되면 WKExtendedRuntimeSession으로 가야 한다.
        UIBackgroundModes: [audio]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.nepnep.NepNep.watchkitapp
        # 4 = Apple Watch. 프로젝트 기본값 "1,2"(아이폰·아이패드)를 반드시 덮어써야 한다.
        TARGETED_DEVICE_FAMILY: "4"
        # 본체에 임베드돼 나가므로 독립 설치 대상이 아니다.
        SKIP_INSTALL: YES

  NepNepTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NepNepTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NepNep
schemes:
  NepNep:
    build:
      targets:
        NepNep: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [NepNepTests]
  # 워치 앱만 따로 시뮬레이터에 올려 보기 위한 스킴 — 본체 스킴은 임베드 의존성으로
  # 워치 타깃을 이미 끌고 간다.
  NepNepWatch:
    build:
      targets:
        NepNepWatch: all
    run:
      config: Debug
